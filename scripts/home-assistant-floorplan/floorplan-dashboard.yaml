# 香山府 Home Assistant 户型灯光面板
#
# 当前启用：主卧、厨房、公卫、书房、客厅、餐厅、玄关和洗手台。
# 全部使用 HA 中已经存在的灯组或单灯实体。
# 主卫、次卧和阳台当前没有对应房间灯实体，因此不显示图层或按钮。
#
# 单击房间按钮：切换整个房间灯光组。
# 长按多灯房间：进入同一 Dashboard 内的单灯子页面。
# 厨房和玄关当前均为单成员灯组，长按直接打开更多信息。

views:
  - title: 香山府
    path: home
    icon: mdi:floor-plan
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: picture-elements
            title: 香山府灯光
            image: /local/floorplan/base.png
            elements:
              # 普通透明房间图层
              - type: conditional
                conditions:
                  - entity: light.zhu_wo_deng_zu
                    state: "on"
                elements:
                  - type: image
                    image: /local/floorplan/master-bedroom-on.png
                    title: null
                    tap_action:
                      action: none
                    hold_action:
                      action: none
                    style:
                      left: 50%
                      top: 50%
                      width: 100%
                      transform: translate(-50%, -50%)
                      pointer-events: none
                      z-index: 1

              - type: conditional
                conditions:
                  - entity: light.chu_fang_deng_zu
                    state: "on"
                elements:
                  - type: image
                    image: /local/floorplan/kitchen-on.png
                    title: null
                    tap_action:
                      action: none
                    hold_action:
                      action: none
                    style:
                      left: 50%
                      top: 50%
                      width: 100%
                      transform: translate(-50%, -50%)
                      pointer-events: none
                      z-index: 1

              - type: conditional
                conditions:
                  - entity: light.gong_wei_deng_zu
                    state: "on"
                elements:
                  - type: image
                    image: /local/floorplan/second-bathroom-on.png
                    title: null
                    tap_action:
                      action: none
                    hold_action:
                      action: none
                    style:
                      left: 50%
                      top: 50%
                      width: 100%
                      transform: translate(-50%, -50%)
                      pointer-events: none
                      z-index: 1

              - type: conditional
                conditions:
                  - entity: light.yeelight_lamp15_0x304653f2
                    state: "on"
                elements:
                  - type: image
                    image: /local/floorplan/study-on.png
                    title: null
                    tap_action:
                      action: none
                    hold_action:
                      action: none
                    style:
                      left: 50%
                      top: 50%
                      width: 100%
                      transform: translate(-50%, -50%)
                      pointer-events: none
                      z-index: 1

              # 线性减淡图层：screen 混合能保留交叉光并累加亮度
              - type: conditional
                conditions:
                  - entity: light.ke_ting_deng_zu
                    state: "on"
                elements:
                  - type: image
                    image: /local/floorplan/living-room-screen.png
                    title: null
                    tap_action:
                      action: none
                    hold_action:
                      action: none
                    style:
                      left: 50%
                      top: 50%
                      width: 100%
                      transform: translate(-50%, -50%)
                      pointer-events: none
                      mix-blend-mode: screen
                      z-index: 2

              - type: conditional
                conditions:
                  - entity: light.can_ting_deng_zu
                    state: "on"
                elements:
                  - type: image
                    image: /local/floorplan/dining-room-screen.png
                    title: null
                    tap_action:
                      action: none
                    hold_action:
                      action: none
                    style:
                      left: 50%
                      top: 50%
                      width: 100%
                      transform: translate(-50%, -50%)
                      pointer-events: none
                      mix-blend-mode: screen
                      z-index: 2

              - type: conditional
                conditions:
                  - entity: light.xuan_guan_deng_zu
                    state: "on"
                elements:
                  - type: image
                    image: /local/floorplan/entry-screen.png
                    title: null
                    tap_action:
                      action: none
                    hold_action:
                      action: none
                    style:
                      left: 50%
                      top: 50%
                      width: 100%
                      transform: translate(-50%, -50%)
                      pointer-events: none
                      mix-blend-mode: screen
                      z-index: 2

              - type: conditional
                conditions:
                  - entity: light.xi_shou_tai_deng_zu
                    state: "on"
                elements:
                  - type: image
                    image: /local/floorplan/washstand-screen.png
                    title: null
                    tap_action:
                      action: none
                    hold_action:
                      action: none
                    style:
                      left: 50%
                      top: 50%
                      width: 100%
                      transform: translate(-50%, -50%)
                      pointer-events: none
                      mix-blend-mode: screen
                      z-index: 2

              # 房间控制按钮。单击开关，长按打开灯具详情/亮度调节。
              - type: state-icon
                entity: light.zhu_wo_deng_zu
                title: 主卧
                icon: mdi:lightbulb
                state_color: true
                tap_action: { action: toggle }
                hold_action:
                  action: navigate
                  navigation_path: /xiangshan-floorplan/master-bedroom
                style:
                  left: 29.5%
                  top: 30%
                  z-index: 3
                  background: rgba(18, 24, 32, 0.78)
                  border-radius: 50%
                  padding: 10px

              - type: state-icon
                entity: light.chu_fang_deng_zu
                title: 厨房
                icon: mdi:lightbulb
                state_color: true
                tap_action: { action: toggle }
                hold_action: { action: more-info }
                style:
                  left: 55.7%
                  top: 33%
                  z-index: 3
                  background: rgba(18, 24, 32, 0.78)
                  border-radius: 50%
                  padding: 10px

              - type: state-icon
                entity: light.gong_wei_deng_zu
                title: 次卫
                icon: mdi:lightbulb
                state_color: true
                tap_action: { action: toggle }
                hold_action:
                  action: navigate
                  navigation_path: /xiangshan-floorplan/second-bathroom
                style:
                  left: 65.7%
                  top: 28%
                  z-index: 3
                  background: rgba(18, 24, 32, 0.78)
                  border-radius: 50%
                  padding: 10px

              - type: state-icon
                entity: light.yeelight_lamp15_0x304653f2
                title: 书房
                icon: mdi:monitor-shimmer
                state_color: true
                tap_action: { action: toggle }
                hold_action: { action: more-info }
                style:
                  left: 81.7%
                  top: 61%
                  z-index: 3
                  background: rgba(18, 24, 32, 0.78)
                  border-radius: 50%
                  padding: 10px

              - type: state-icon
                entity: light.ke_ting_deng_zu
                title: 客厅
                icon: mdi:lightbulb
                state_color: true
                tap_action: { action: toggle }
                hold_action:
                  action: navigate
                  navigation_path: /xiangshan-floorplan/living-room
                style:
                  left: 31.3%
                  top: 70%
                  z-index: 3
                  background: rgba(18, 24, 32, 0.78)
                  border-radius: 50%
                  padding: 10px

              - type: state-icon
                entity: light.can_ting_deng_zu
                title: 餐厅
                icon: mdi:lightbulb
                state_color: true
                tap_action: { action: toggle }
                hold_action:
                  action: navigate
                  navigation_path: /xiangshan-floorplan/dining-room
                style:
                  left: 49.8%
                  top: 63%
                  z-index: 3
                  background: rgba(18, 24, 32, 0.78)
                  border-radius: 50%
                  padding: 10px

              - type: state-icon
                entity: light.xuan_guan_deng_zu
                title: 玄关
                icon: mdi:lightbulb
                state_color: true
                tap_action: { action: toggle }
                hold_action: { action: more-info }
                style:
                  left: 61.8%
                  top: 59%
                  z-index: 3
                  background: rgba(18, 24, 32, 0.78)
                  border-radius: 50%
                  padding: 10px

              - type: state-icon
                entity: light.xi_shou_tai_deng_zu
                title: 洗手台
                icon: mdi:lightbulb
                state_color: true
                tap_action: { action: toggle }
                hold_action:
                  action: navigate
                  navigation_path: /xiangshan-floorplan/washstand
                style:
                  left: 66.2%
                  top: 44%
                  z-index: 3
                  background: rgba(18, 24, 32, 0.78)
                  border-radius: 50%
                  padding: 10px

  # 以下是同一 Dashboard 内的房间子页面。
  # 灯具数量不一致时，可按实际情况增删 tile。
  - title: 主卧灯光
    path: master-bedroom
    subview: true
    back_path: /xiangshan-floorplan/home
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: light.zhu_wo_lu_mi_e1_dan_kong
            name: 吊灯
          - type: tile
            entity: light.zhu_wo_lu_mi_e1_shuang_kong_left
            name: 灯带
          - type: tile
            entity: light.zhu_wo_lu_mi_e1_shuang_kong_right
            name: 筒灯
          - type: tile
            entity: light.ye_deng
            name: 夜灯

  - title: 公卫灯光
    path: second-bathroom
    subview: true
    back_path: /xiangshan-floorplan/home
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: light.gong_wei_kai_guan_center
            name: 灯带
          - type: tile
            entity: light.gong_wei_kai_guan_left
            name: 筒灯

  - title: 客厅灯光
    path: living-room
    subview: true
    back_path: /xiangshan-floorplan/home
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: light.ou_rui_bo_san_kong_ke_ting_center
            name: 吊灯
          - type: tile
            entity: light.ou_rui_bo_san_kong_ke_ting_bottom
            name: 筒灯
          - type: tile
            entity: light.ou_rui_bo_san_kong_ke_ting_top
            name: 灯带

  - title: 餐厅灯光
    path: dining-room
    subview: true
    back_path: /xiangshan-floorplan/home
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: light.magic_switch_s1e_ede9_switch_3
            name: 吊灯
          - type: tile
            entity: light.magic_switch_s1e_ede9_switch_2
            name: 筒灯

  - title: 洗手台灯光
    path: washstand
    subview: true
    back_path: /xiangshan-floorplan/home
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: light.gong_wei_zou_lang_kai_guan_right
            name: 灯带
          - type: tile
            entity: light.gong_wei_zou_lang_kai_guan_left
            name: 筒灯
